<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JamshadBhatti Finance World Hub</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#00c853">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Finance Hub">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0a2e1a;
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .logo {
      width: 120px;
      height: 120px;
      background: linear-gradient(135deg, #00c853, #00e676);
      border-radius: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 60px;
      margin-bottom: 20px;
      box-shadow: 0 10px 40px rgba(0,200,83,0.4);
    }
    h1 {
      font-size: 24px;
      color: #00e676;
      text-align: center;
      margin-bottom: 8px;
    }
    p {
      color: #aaa;
      text-align: center;
      margin-bottom: 30px;
      font-size: 14px;
    }
    .btn {
      background: linear-gradient(135deg, #00c853, #00e676);
      color: #0a2e1a;
      border: none;
      padding: 16px 40px;
      border-radius: 50px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      box-shadow: 0 8px 25px rgba(0,200,83,0.5);
      margin-bottom: 20px;
    }
    .install-tip {
      background: rgba(0,200,83,0.1);
      border: 1px solid rgba(0,200,83,0.3);
      border-radius: 16px;
      padding: 20px;
      margin-top: 30px;
      max-width: 340px;
      width: 100%;
    }
    .install-tip h3 {
      color: #00e676;
      margin-bottom: 12px;
      font-size: 16px;
    }
    .step {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 10px;
      font-size: 14px;
      color: #ccc;
    }
    .step-num {
      background: #00c853;
      color: #0a2e1a;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 12px;
      flex-shrink: 0;
    }
    #installBtn {
      display: none;
      width: 100%;
      max-width: 340px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="logo">₨</div>
  <h1>JamshadBhatti Finance Hub</h1>
  <p>Aapka Personal Finance Manager</p>

  <a href="JamshadBhatti-Finance-App.html" class="btn">🚀 App Kholo</a>

  <button class="btn" id="installBtn" onclick="installApp()">📲 Phone pe Install Karo</button>

  <div class="install-tip">
    <h3>📱 Phone pe App Install Karein:</h3>
    <div class="step">
      <div class="step-num">1</div>
      <span>Browser mein 3 dots (⋮) dabao</span>
    </div>
    <div class="step">
      <div class="step-num">2</div>
      <span>"Add to Home Screen" select karo</span>
    </div>
    <div class="step">
      <div class="step-num">3</div>
      <span>"Add" dabao — App install ho jayegi!</span>
    </div>
    <div class="step">
      <div class="step-num">4</div>
      <span>Home screen pe Finance Hub icon dikhega ✅</span>
    </div>
  </div>

  <script>
    // Register Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/service-worker.js')
        .then(() => console.log('SW registered'))
        .catch(err => console.log('SW error:', err));
    }

    // PWA Install prompt
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('installBtn').style.display = 'block';
    });

    function installApp() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((result) => {
          if (result.outcome === 'accepted') {
            document.getElementById('installBtn').style.display = 'none';
          }
          deferredPrompt = null;
        });
      }
    }
  </script>
</body>
</html>
